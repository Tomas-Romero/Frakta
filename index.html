<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#7DA089" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frakta</title>
    <script>
      // Evita el flash de tema incorrecto antes de que Dexie resuelva la
      // config real. Ver src/lib/tema.ts.
      (function () {
        try {
          var t = localStorage.getItem('frakta-tema') || 'auto';
          var oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
